name: Fetch rate card HTML
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-html.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download HTML
        run: |
          curl -fsSL -o rate-card.html "https://litter.catbox.moe/0cond1.html"
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/rate-card.html"><title>Rocky Veen Rate Card</title></head><body><p><a href="/rate-card.html">Open Rate Card</a></p></body></html>' > index.html
          wc -c rate-card.html index.html
          head -c 120 rate-card.html; echo
      - name: Commit HTML
        run: |
          git config user.name "ratecard-bot"
          git config user.email "ratecard-bot@users.noreply.github.com"
          git add rate-card.html index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add Rocky Veen rate card HTML"
          git push
