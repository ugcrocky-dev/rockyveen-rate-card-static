name: Fetch rate card HTML
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-html.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download HTML
        run: |
          curl -fsSL -o rate-card.html "https://temporary-prompt-tungsten-0x0xcob.vercel.app/rate-card.html"
          curl -fsSL -o index.html "https://temporary-prompt-tungsten-0x0xcob.vercel.app/index.html"
          wc -c rate-card.html index.html
          head -c 120 rate-card.html
      - name: Commit HTML
        run: |
          git config user.name "ratecard-bot"
          git config user.email "ratecard-bot@users.noreply.github.com"
          git add rate-card.html index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Add Rocky Veen rate card HTML"
          git push
